<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — SaveMoney</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  (function() {
    const tema = localStorage.getItem("savemoney_theme") || "light";
    document.documentElement.setAttribute("data-theme", tema);
  })();
</script>
</head>
<body>

<div class="flash-container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo" style="justify-content:center; margin-bottom: 14px;">💰 SaveMoney</div>
    <h2>Redefinir senha</h2>
    <p class="subtitle">Escolha uma nova senha para sua conta.</p>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <div class="form-group">
        <label for="password">Nova senha</label>
        <input type="password" id="password" name="password" class="form-control" minlength="6" required autofocus>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirmar nova senha</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Redefinir senha</button>
    </form>

    <div class="auth-links">
      <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight:600;">Voltar para o login</a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
